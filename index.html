<!doctype html>
<html lang="pt-BR">

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js?v=16',{updateViaCache:'none'})
      .then(reg=>reg.update())
      .catch(()=>{});
  });
}
</script>
